{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="panel" style="max-width: 560px; margin: 0 auto;">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter the email you used during registration and we will send you a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
    <p class="muted"><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
