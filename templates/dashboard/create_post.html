{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
<div class="panel" style="max-width: 800px; margin: 0 auto;">
    <h1>Create a post</h1>
    <p class="muted">We prefilled this form with AI content so you can adjust it before scheduling.</p>
    <div class="actions" style="margin-bottom: 16px;">
        <a class="button secondary" href="{% url 'dashboard:save_generated_post' %}">Save AI Draft</a>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Schedule post</button>
    </form>
</div>
{% endblock %}
