{% extends "base.html" %}

{% block title %}Create Workspace{% endblock %}

{% block content %}
<div class="panel" style="max-width: 720px; margin: 0 auto;">
    <h1>Create your content space</h1>
    <p class="muted">Use this for a creator page, personal brand, business, or any account you want to grow. Website and tone details are optional.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create space</button>
    </form>
</div>
{% endblock %}
