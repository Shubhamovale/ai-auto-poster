<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Auto Poster{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f1e8;
            --panel: #fffaf3;
            --ink: #1d1d1b;
            --muted: #66604f;
            --accent: #c85a32;
            --accent-dark: #8e3215;
            --line: #e6d8c4;
            --success: #306844;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top left, rgba(200, 90, 50, 0.16), transparent 30%),
                linear-gradient(180deg, #f8f4ec 0%, #f1e7d8 100%);
            color: var(--ink);
        }
        a { color: inherit; text-decoration: none; }
        .shell {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 48px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 0 28px;
        }
        .brand {
            font-size: 1.4rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .panel {
            background: rgba(255, 250, 243, 0.92);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(42, 27, 14, 0.08);
            padding: 24px;
        }
        .button, button, input[type="submit"] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: white;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .button.secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #fffdf8;
            margin-top: 6px;
        }
        label { display: block; font-size: 0.95rem; margin-top: 14px; }
        .grid {
            display: grid;
            gap: 20px;
        }
        .grid.two {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .muted { color: var(--muted); }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 18px;
        }
        .messages li {
            background: rgba(48, 104, 68, 0.1);
            border: 1px solid rgba(48, 104, 68, 0.25);
            color: var(--success);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--line);
        }
        .hero {
            display: grid;
            gap: 18px;
            padding: 48px 0 32px;
        }
        .hero h1 {
            font-size: clamp(2.6rem, 6vw, 5rem);
            line-height: 0.95;
            margin: 0;
            max-width: 10ch;
        }
        .hero p {
            font-size: 1.1rem;
            max-width: 55ch;
            color: var(--muted);
        }
        .feature-list {
            display: grid;
            gap: 14px;
        }
        .feature-item {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.52);
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media (max-width: 700px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .shell { width: min(100% - 20px, 1120px); }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <a href="/" class="brand">AI Auto Poster</a>
            <div class="actions">
                {% if request.user.is_authenticated %}
                    <a class="button secondary" href="{% url 'dashboard:home' %}">Dashboard</a>
                    <a class="button secondary" href="{% url 'profile' %}">Profile</a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="button">Logout</button>
                    </form>
                {% else %}
                    <a class="button secondary" href="{% url 'login' %}">Login</a>
                    <a class="button" href="{% url 'signup' %}">Start Free</a>
                {% endif %}
            </div>
        </div>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
