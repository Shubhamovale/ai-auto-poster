services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ASYNC_TASKS_ENABLED: "1"
    volumes:
      - .:/app
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      ASYNC_TASKS_ENABLED: "1"
    volumes:
      - .:/app
    depends_on:
      - redis
  beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      ASYNC_TASKS_ENABLED: "1"
    volumes:
      - .:/app
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
