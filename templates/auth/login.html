{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="panel" style="max-width: 520px; margin: 0 auto;">
    <h1>Welcome back</h1>
    <p class="muted">Use your username or the email you registered with.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p class="muted"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
    <p class="muted">Need an account? <a href="{% url 'signup' %}">Start free here</a>.</p>
</div>
{% endblock %}
