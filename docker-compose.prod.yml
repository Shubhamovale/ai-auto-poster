services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_auto_poster}
      POSTGRES_USER: ${POSTGRES_USER:-ai_auto_poster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_auto_poster} -d ${POSTGRES_DB:-ai_auto_poster}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-ai_auto_poster}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-ai_auto_poster}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-change-me}}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ASYNC_TASKS_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "80:8000"

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-ai_auto_poster}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-ai_auto_poster}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-change-me}}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ASYNC_TASKS_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-ai_auto_poster}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-ai_auto_poster}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-change-me}}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ASYNC_TASKS_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
